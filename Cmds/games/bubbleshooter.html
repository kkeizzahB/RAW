<!DOCTYPE html>
<html>
<head>
  <title>Bubble Shooter with Pointers</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      touch-action: none;
    }
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    canvas {
      display: block;
      background: black;
      border: 2px solid #333;
      border-radius: 8px;
      touch-action: none;
    }
    .controls {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .ctrl-btn {
      background: #222;
      color: white;
      border: 2px solid #666;
      border-radius: 60px;
      width: 70px;
      height: 70px;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: 0.15s;
      touch-action: manipulation;
      box-shadow: 0 4px 0 #111;
    }
    .ctrl-btn:active {
      transform: scale(0.92);
      background: #333;
      box-shadow: 0 2px 0 #111;
    }
    .ctrl-btn.left {
      background: #2a2a4a;
    }
    .ctrl-btn.right {
      background: #2a4a2a;
    }
    .ctrl-btn.fire {
      background: #6a2a2a;
      width: 90px;
      border-color: #aa5555;
      font-size: 28px;
    }
    .ctrl-btn:focus-visible {
      outline: 2px solid #ffaa00;
    }
    @media (max-width: 500px) {
      .ctrl-btn {
        width: 60px;
        height: 60px;
        font-size: 26px;
      }
      .ctrl-btn.fire {
        width: 75px;
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <canvas width="271" height="392" id="game"></canvas>
  <div class="controls">
    <button class="ctrl-btn left" id="leftBtn">◀</button>
    <button class="ctrl-btn fire" id="fireBtn">🔥</button>
    <button class="ctrl-btn right" id="rightBtn">▶</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const context = canvas.getContext('2d');

// Grid and constants
const grid = 32;
const wallSize = 4;
const bubbleGap = 1;

const colorMap = {
  'R': 'red',
  'G': 'green',
  'B': 'blue',
  'Y': 'yellow'
};
const colors = Object.values(colorMap);

const level1 = [
  ['R','R','Y','Y','B','B','G','G'],
  ['R','R','Y','Y','B','B','G'],
  ['B','B','G','G','R','R','Y','Y'],
  ['B','G','G','R','R','Y','Y']
];

let bubbles = [];
let particles = [];

// Helpers
function degToRad(deg) { return (deg * Math.PI) / 180; }
function getRandomInt(min, max) {
  min = Math.ceil(min);
  max = Math.floor(max);
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function getDistance(obj1, obj2) {
  return Math.hypot(obj1.x - obj2.x, obj1.y - obj2.y);
}
function collides(obj1, obj2) {
  return getDistance(obj1, obj2) < obj1.radius + obj2.radius;
}
function rotatePoint(x, y, angle) {
  const s = Math.sin(angle);
  const c = Math.cos(angle);
  return { x: x * c - y * s, y: x * s + y * c };
}

// Closest bubble (active or inactive)
function getClosestBubble(obj, activeState = false) {
  const candidates = bubbles.filter(b => b.active === activeState && collides(obj, b));
  if (!candidates.length) return null;
  return candidates
    .map(b => ({ distance: getDistance(obj, b), bubble: b }))
    .sort((a, b) => a.distance - b.distance)[0].bubble;
}

// Create bubble (color = null => inactive)
function createBubble(x, y, color) {
  const row = Math.floor(y / grid);
  const col = Math.floor(x / grid);
  const startX = row % 2 === 0 ? 0 : 0.5 * grid;
  const center = grid / 2;
  bubbles.push({
    x: wallSize + (grid + bubbleGap) * col + startX + center,
    y: wallSize + (grid + bubbleGap - 4) * row + center,
    radius: grid / 2,
    color: color || null,
    active: !!color
  });
}

// Build grid
for (let row = 0; row < 10; row++) {
  const cols = row % 2 === 0 ? 8 : 7;
  for (let col = 0; col < cols; col++) {
    const key = level1[row] && level1[row][col] ? level1[row][col] : null;
    const color = key ? colorMap[key] : null;
    createBubble(col * grid, row * grid, color);
  }
}

// Neighbors (hex directions)
function getNeighbors(bubble) {
  const neighbors = [];
  const dirs = [
    rotatePoint(grid, 0, 0),
    rotatePoint(grid, 0, degToRad(60)),
    rotatePoint(grid, 0, degToRad(120)),
    rotatePoint(grid, 0, degToRad(180)),
    rotatePoint(grid, 0, degToRad(240)),
    rotatePoint(grid, 0, degToRad(300))
  ];
  for (let d of dirs) {
    const test = { x: bubble.x + d.x, y: bubble.y + d.y, radius: bubble.radius };
    const n = getClosestBubble(test, true);
    if (n && n !== bubble && !neighbors.includes(n)) neighbors.push(n);
  }
  return neighbors;
}

// Remove matching groups
function removeMatch(targetBubble) {
  const matches = [targetBubble];
  bubbles.forEach(b => b.processed = false);
  targetBubble.processed = true;
  let neighbors = getNeighbors(targetBubble);
  for (let i = 0; i < neighbors.length; i++) {
    let n = neighbors[i];
    if (!n.processed) {
      n.processed = true;
      if (n.color === targetBubble.color) {
        matches.push(n);
        neighbors = neighbors.concat(getNeighbors(n));
      }
    }
  }
  if (matches.length >= 3) {
    matches.forEach(b => b.active = false);
  }
}

// Drop floating bubbles
function dropFloatingBubbles() {
  const activeBubbles = bubbles.filter(b => b.active);
  activeBubbles.forEach(b => b.processed = false);
  let neighbors = activeBubbles.filter(b => b.y - grid <= wallSize);
  for (let i = 0; i < neighbors.length; i++) {
    let n = neighbors[i];
    if (!n.processed) {
      n.processed = true;
      neighbors = neighbors.concat(getNeighbors(n));
    }
  }
  activeBubbles
    .filter(b => !b.processed)
    .forEach(b => {
      b.active = false;
      particles.push({
        x: b.x,
        y: b.y,
        color: b.color,
        radius: b.radius,
        active: true
      });
    });
}

// Current bubble
const curBubblePos = {
  x: canvas.width / 2,
  y: canvas.height - grid * 1.5
};
const curBubble = {
  x: curBubblePos.x,
  y: curBubblePos.y,
  color: 'red',
  radius: grid / 2,
  speed: 8,
  dx: 0,
  dy: 0
};

let shootDeg = 0;
const minDeg = degToRad(-60);
const maxDeg = degToRad(60);
let shootDir = 0; // -1 left, 1 right, 0 none

function getNewBubble() {
  curBubble.x = curBubblePos.x;
  curBubble.y = curBubblePos.y;
  curBubble.dx = 0;
  curBubble.dy = 0;
  curBubble.color = colors[getRandomInt(0, colors.length - 1)];
}

function handleCollision(bubble) {
  if (!bubble) {
    window.alert('Game Over');
    window.location.reload();
    return;
  }
  bubble.color = curBubble.color;
  bubble.active = true;
  getNewBubble();
  removeMatch(bubble);
  dropFloatingBubbles();
}

// ----- GAME LOOP -----
function loop() {
  requestAnimationFrame(loop);
  context.clearRect(0, 0, canvas.width, canvas.height);

  // Aiming
  shootDeg += degToRad(2) * shootDir;
  if (shootDeg < minDeg) shootDeg = minDeg;
  if (shootDeg > maxDeg) shootDeg = maxDeg;

  // Move current bubble
  curBubble.x += curBubble.dx;
  curBubble.y += curBubble.dy;

  // Wall collisions (left/right)
  if (curBubble.x - grid / 2 < wallSize) {
    curBubble.x = wallSize + grid / 2;
    curBubble.dx *= -1;
  } else if (curBubble.x + grid / 2 > canvas.width - wallSize) {
    curBubble.x = canvas.width - wallSize - grid / 2;
    curBubble.dx *= -1;
  }

  // Top wall collision
  if (curBubble.y - grid / 2 < wallSize) {
    const closest = getClosestBubble(curBubble, false);
    handleCollision(closest);
  }

  // Collision with active bubbles
  for (let b of bubbles) {
    if (b.active && collides(curBubble, b)) {
      const closest = getClosestBubble(curBubble, false);
      handleCollision(closest);
      break;
    }
  }

  // Particles fall
  particles.forEach(p => p.y += 8);
  particles = particles.filter(p => p.y < canvas.height - grid / 2);

  // Draw walls
  context.fillStyle = 'lightgrey';
  context.fillRect(0, 0, canvas.width, wallSize);
  context.fillRect(0, 0, wallSize, canvas.height);
  context.fillRect(canvas.width - wallSize, 0, wallSize, canvas.height);

  // Draw bubbles & particles
  bubbles.concat(particles).forEach(b => {
    if (!b.active) return;
    context.fillStyle = b.color;
    context.beginPath();
    context.arc(b.x, b.y, b.radius, 0, 2 * Math.PI);
    context.fill();
  });

  // Draw aiming arrow
  context.save();
  context.translate(curBubblePos.x, curBubblePos.y);
  context.rotate(shootDeg);
  context.translate(0, -grid / 2 * 4.5);
  context.strokeStyle = 'white';
  context.lineWidth = 2;
  context.beginPath();
  context.moveTo(0, 0);
  context.lineTo(0, grid * 2);
  context.moveTo(0, 0);
  context.lineTo(-10, grid * 0.4);
  context.moveTo(0, 0);
  context.lineTo(10, grid * 0.4);
  context.stroke();
  context.restore();

  // Draw current bubble
  context.fillStyle = curBubble.color;
  context.beginPath();
  context.arc(curBubble.x, curBubble.y, curBubble.radius, 0, 2 * Math.PI);
  context.fill();
}

// ----- POINTER CONTROLS (buttons + keyboard) -----
function setShootDir(dir) {
  shootDir = dir;
}

function fireBubble() {
  if (curBubble.dx === 0 && curBubble.dy === 0) {
    curBubble.dx = Math.sin(shootDeg) * curBubble.speed;
    curBubble.dy = -Math.cos(shootDeg) * curBubble.speed;
  }
}

// Buttons
document.getElementById('leftBtn').addEventListener('mousedown', (e) => { e.preventDefault(); setShootDir(-1); });
document.getElementById('leftBtn').addEventListener('mouseup', (e) => { e.preventDefault(); if (shootDir === -1) setShootDir(0); });
document.getElementById('leftBtn').addEventListener('mouseleave', (e) => { if (shootDir === -1) setShootDir(0); });
document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); setShootDir(-1); });
document.getElementById('leftBtn').addEventListener('touchend', (e) => { e.preventDefault(); if (shootDir === -1) setShootDir(0); });
document.getElementById('leftBtn').addEventListener('touchcancel', (e) => { if (shootDir === -1) setShootDir(0); });

document.getElementById('rightBtn').addEventListener('mousedown', (e) => { e.preventDefault(); setShootDir(1); });
document.getElementById('rightBtn').addEventListener('mouseup', (e) => { e.preventDefault(); if (shootDir === 1) setShootDir(0); });
document.getElementById('rightBtn').addEventListener('mouseleave', (e) => { if (shootDir === 1) setShootDir(0); });
document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); setShootDir(1); });
document.getElementById('rightBtn').addEventListener('touchend', (e) => { e.preventDefault(); if (shootDir === 1) setShootDir(0); });
document.getElementById('rightBtn').addEventListener('touchcancel', (e) => { if (shootDir === 1) setShootDir(0); });

document.getElementById('fireBtn').addEventListener('click', (e) => { fireBubble(); });
document.getElementById('fireBtn').addEventListener('touchstart', (e) => { e.preventDefault(); fireBubble(); });

// Keyboard (still works)
document.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') setShootDir(-1);
  else if (e.code === 'ArrowRight') setShootDir(1);
  else if (e.code === 'Space') {
    e.preventDefault();
    fireBubble();
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' && shootDir === -1) setShootDir(0);
  else if (e.code === 'ArrowRight' && shootDir === 1) setShootDir(0);
});

// Start
getNewBubble();
requestAnimationFrame(loop);
</script>
</body>
</html>
