<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>KEITH MD HELP MENU</title>
<style>
  :root{
    --bg:#0a0b14;
    --bg-2:#0f1120;
    --panel:#141628;
    --panel2:#1b1e35;
    --border:#262a45;
    --text:#eef0ff;
    --muted:#8a90b8;

    --accent:#7c5cff;          /* indigo/violet */
    --accent-2:#22d3ee;        /* cyan */
    --accent-soft:rgba(124,92,255,.14);
    --accent-border:rgba(124,92,255,.42);
    --accent-glow:rgba(124,92,255,.28);

    --radius:14px;
    --shadow:0 8px 28px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.4;min-height:100%}
  body{padding:12px 12px 90px;
    background:
      radial-gradient(900px 420px at 15% -10%, rgba(124,92,255,.20), transparent 65%),
      radial-gradient(900px 420px at 100% 10%, rgba(34,211,238,.12), transparent 65%),
      linear-gradient(180deg, var(--bg-2), var(--bg));
    background-attachment:fixed}

  /* ---------- Header ---------- */
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius);
    background:linear-gradient(135deg, rgba(124,92,255,.28), rgba(34,211,238,.10) 60%, var(--panel));
    border:1px solid var(--accent-border);box-shadow:var(--shadow);margin-bottom:10px;
    position:relative;overflow:hidden}
  header:before{content:"";position:absolute;inset:0;
    background:radial-gradient(400px 120px at 100% 0%, rgba(34,211,238,.18), transparent 70%);
    pointer-events:none}
  header .logo{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#0a0b14;box-shadow:0 6px 18px var(--accent-glow)}
  header .logo svg{width:20px;height:20px}
  header .titles{min-width:0}
  header h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.4px;
    background:linear-gradient(90deg, #fff, #c9c4ff 60%, #9de9f5);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  header p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
  .prefix-chip{margin-left:auto;flex:0 0 auto;padding:4px 10px;border-radius:999px;
    background:var(--accent-soft);border:1px solid var(--accent-border);color:#cfc6ff;
    font-size:11.5px;font-weight:800;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;
    box-shadow:0 0 0 3px rgba(124,92,255,.06) inset}

  /* ---------- Stats ---------- */
  .stats{display:flex;gap:6px;margin-bottom:10px}
  .stat{flex:1;background:linear-gradient(180deg, var(--panel), var(--bg-2));
    border:1px solid var(--border);border-radius:12px;padding:9px 10px;text-align:center}
  .stat .v{font-size:15px;font-weight:800;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .stat .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:1px}

  /* ---------- Sticky search ---------- */
  .search-sticky{
    position:sticky;top:0;z-index:15;
    padding:8px 0 10px;margin:-4px 0 6px;
    background:linear-gradient(to bottom,var(--bg) 72%, rgba(10,11,20,0));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .search-wrap{position:relative}
  .search-wrap input{width:100%;padding:11px 14px 11px 40px;border-radius:12px;
    border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;
    outline:none;transition:border-color .15s,box-shadow .15s}
  .search-wrap input::placeholder{color:var(--muted)}
  .search-wrap input:focus{border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(124,92,255,.18), 0 0 0 1px var(--accent-border)}
  .search-wrap .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);
    color:var(--muted);width:16px;height:16px;pointer-events:none;display:flex;align-items:center}

  /* ---------- Category list ---------- */
  .cat-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .cat-item{display:flex;align-items:center;gap:11px;padding:12px 14px;
    background:linear-gradient(180deg, var(--panel), var(--bg-2));
    border:1px solid var(--border);border-radius:12px;
    cursor:pointer;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s;
    position:relative;overflow:hidden}
  .cat-item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg, var(--accent), var(--accent-2));opacity:.85}
  .cat-item:active{transform:scale(.99);background:var(--panel2);
    box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .cat-item .cat-icon{width:34px;height:34px;flex:0 0 34px;border-radius:9px;
    display:grid;place-items:center;color:#d9d2ff;
    background:var(--accent-soft);border:1px solid var(--accent-border)}
  .cat-item .cat-icon svg{width:17px;height:17px;display:block}
  .cat-item .cat-name{flex:1;min-width:0;font-size:14px;font-weight:700;letter-spacing:.2px}
  .cat-item .cat-count{flex:0 0 auto;padding:2px 8px;border-radius:999px;
    background:linear-gradient(135deg, rgba(124,92,255,.22), rgba(34,211,238,.16));
    border:1px solid var(--accent-border);color:#d9d2ff;
    font-size:11px;font-weight:800;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .cat-item .cat-chev{flex:0 0 auto;color:var(--muted);display:flex;align-items:center}
  .cat-item .cat-chev svg{width:13px;height:13px;display:block}

  /* ---------- Sticky category header ---------- */
  .cat-sticky{
    position:sticky;top:0;z-index:15;
    padding:8px 0 10px;margin:-4px 0 6px;
    background:linear-gradient(to bottom,var(--bg) 72%, rgba(10,11,20,0));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .back-bar{display:flex;align-items:center;gap:10px}
  .back-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;
    background:var(--panel);border:1px solid var(--accent-border);color:#d9d2ff;
    font-size:12px;font-weight:700;cursor:pointer;user-select:none}
  .back-btn:active{background:var(--panel2)}
  .back-btn svg{width:12px;height:12px;display:block}
  .cat-title{font-size:12px;font-weight:800;letter-spacing:.9px;
    text-transform:uppercase;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .cat-total{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}

  /* ---------- Command cards ---------- */
  .cmd{border:1px solid var(--border);background:var(--panel);border-radius:12px;
    margin-bottom:6px;overflow:hidden;transition:border-color .15s,background .15s}
  .cmd.open{border-color:var(--accent-border);
    background:linear-gradient(180deg, var(--panel2), var(--panel))}
  .cmd-head{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;user-select:none}
  .cmd-head:active{background:rgba(124,92,255,.06)}
  .cmd-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;font-weight:700;
    color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;max-width:45%}
  .cmd-name .pfx{color:var(--accent-2)}
  .cmd-desc{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;text-align:right}
  .chev{flex:0 0 auto;color:var(--muted);transition:transform .2s;display:flex;align-items:center}
  .chev svg{width:11px;height:11px;display:block}
  .cmd.open .chev{transform:rotate(90deg);color:var(--accent-2)}

  .cmd-body{display:none;padding:0 13px 12px;border-top:1px solid var(--border);animation:fade .18s ease}
  .cmd.open .cmd-body{display:block}
  .row{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(138,144,184,.18)}
  .row:last-child{border-bottom:none;padding-bottom:0}
  .row .label{flex:0 0 68px;font-size:10.5px;font-weight:800;letter-spacing:.5px;
    text-transform:uppercase;color:var(--muted);padding-top:3px}
  .row .value{flex:1;min-width:0;font-size:12.5px;color:var(--text);word-break:break-word}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.28);color:#9de9f5;
    padding:2px 6px;border-radius:6px;display:inline-block;margin:2px 4px 2px 0}
  .alias{color:#9de9f5}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px}
  .empty .big{display:flex;justify-content:center;margin-bottom:10px;color:var(--muted)}
  .empty .big svg{width:36px;height:36px}

  footer{text-align:center;color:var(--muted);font-size:11px;padding:14px 0 4px;opacity:.75}

  #top{position:fixed;right:14px;bottom:16px;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--accent-border);
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#0a0b14;display:none;place-items:center;cursor:pointer;
    box-shadow:0 8px 22px var(--accent-glow);z-index:20}
  #top svg{width:17px;height:17px}
  #top.show{display:grid}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="7" width="16" height="12" rx="3"/>
      <path d="M12 7V4"/>
      <circle cx="12" cy="3" r="1"/>
      <circle cx="9" cy="13" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="13" r="1.2" fill="currentColor" stroke="none"/>
      <path d="M9.5 16.5h5"/>
    </svg>
  </div>
  <div class="titles">
    <h1 id="botTitle">KEITH MD HELP MENU</h1>
    <p>Tap a category to view its commands</p>
  </div>
  <span class="prefix-chip" id="prefixChip">.</span>
</header>

<div class="stats">
  <div class="stat"><div class="v" id="statTotal">0</div><div class="l">Commands</div></div>
  <div class="stat"><div class="v" id="statCats">0</div><div class="l">Categories</div></div>
  <div class="stat"><div class="v" id="statShown">0</div><div class="l">Showing</div></div>
</div>

<div class="search-sticky">
  <div class="search-wrap">
    <span class="icon">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.3-4.3"/>
      </svg>
    </span>
    <input id="search" type="text" placeholder="Search commands, aliases, descriptions…"
      autocomplete="off" autocapitalize="off" spellcheck="false" />
  </div>
</div>

<main id="view"></main>

<footer id="footer"></footer>

<button id="top" aria-label="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5"/>
    <path d="M5 12l7-7 7 7"/>
  </svg>
</button>

<script>
(function () {
  "use strict";

  const DATA = __MENUDATA__;
  const cats    = (DATA && DATA.cats)   || {};
  const prefix  = (DATA && DATA.prefix) || ".";
  const botname = (DATA && DATA.botname)|| "KEITH MD";
  const total   = (DATA && DATA.total)  || 0;

  const catKeys = Object.keys(cats).sort();

  const elView  = document.getElementById("view");
  const elSearch= document.getElementById("search");
  const elFooter= document.getElementById("footer");
  const elTop   = document.getElementById("top");
  const elPrefix= document.getElementById("prefixChip");
  const elTitle = document.getElementById("botTitle");
  const elStatT = document.getElementById("statTotal");
  const elStatC = document.getElementById("statCats");
  const elStatS = document.getElementById("statShown");

  elPrefix.textContent = prefix;
  elTitle.textContent  = (botname || "KEITH MD").toUpperCase() + " HELP MENU";
  elStatT.textContent  = total;
  elStatC.textContent  = catKeys.length;
  elFooter.textContent = total + " command" + (total === 1 ? "" : "s") + " available";

  let activeCat = null;
  let query = "";

  function esc(s){
    return String(s==null?"":s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function matches(cmd){
    if(!query) return true;
    const q = query.toLowerCase();
    if(cmd.n && cmd.n.toLowerCase().indexOf(q)!==-1) return true;
    if(cmd.d && cmd.d.toLowerCase().indexOf(q)!==-1) return true;
    if(cmd.u && String(cmd.u).toLowerCase().indexOf(q)!==-1) return true;
    if(Array.isArray(cmd.a)){
      for(let i=0;i<cmd.a.length;i++){
        if(String(cmd.a[i]).toLowerCase().indexOf(q)!==-1) return true;
      }
    }
    return false;
  }

  const ICONS = {
    general:   '<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
    game:      '<rect x="3" y="7" width="18" height="10" rx="3"/><path d="M7 12h4"/><path d="M9 10v4"/><circle cx="16" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="18" cy="13" r="1" fill="currentColor" stroke="none"/>',
    download:  '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>',
    media:     '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3V9Z" fill="currentColor" stroke="none"/>',
    tool:      '<path d="M14.7 6.3a4 4 0 1 0 5 5L21 21l-3 .1L8.6 11.7a4 4 0 0 1-5-5l3 3 2.8-.7.7-2.8-3-3Z"/>',
    ai:        '<path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/><rect x="7" y="7" width="10" height="10" rx="3"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
    system:    '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/>',
    owner:     '<path d="M3 7l4 4 5-7 5 7 4-4v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>',
    group:     '<circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M15 20a4 4 0 0 1 6 0"/>',
    fun:       '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/>',
    search:    '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    convert:   '<path d="M4 8h12"/><path d="M13 5l3 3-3 3"/><path d="M20 16H8"/><path d="M11 13l-3 3 3 3"/>',
    sticker:   '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M14 20v-4a2 2 0 0 1 2-2h4"/><circle cx="9" cy="9" r="1" fill="currentColor" stroke="none"/>',
    audio:     '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
    text:      '<path d="M5 5h14"/><path d="M5 10h14"/><path d="M5 15h10"/><path d="M5 20h7"/>',
    default:   '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>'
  };

  function iconFor(name){
    const n = name.toLowerCase();
    let key = "default";
    if(n.includes("general")) key = "general";
    else if(n.includes("game")) key = "game";
    else if(n.includes("download")) key = "download";
    else if(n.includes("media") || n.includes("video") || n.includes("image")) key = "media";
    else if(n.includes("tool")) key = "tool";
    else if(n.includes("ai") || n.includes("chat")) key = "ai";
    else if(n.includes("system") || n.includes("bot")) key = "system";
    else if(n.includes("owner") || n.includes("admin")) key = "owner";
    else if(n.includes("group")) key = "group";
    else if(n.includes("fun")) key = "fun";
    else if(n.includes("search")) key = "search";
    else if(n.includes("convert")) key = "convert";
    else if(n.includes("sticker")) key = "sticker";
    else if(n.includes("audio") || n.includes("sound") || n.includes("music")) key = "audio";
    else if(n.includes("text")) key = "text";
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[key]+'</svg>';
  }

  const CHEVRON       = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  const CHEVRON_SMALL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  const BACK_ARROW    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
  const SEARCH_BIG    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';

  function buildCard(cmd){
    const aliases = (Array.isArray(cmd.a) && cmd.a.length)
      ? cmd.a.map(a => '<span class="mono alias">'+esc(prefix+a)+'</span>').join("")
      : '<span style="color:var(--muted)">none</span>';
    const desc  = cmd.d ? esc(cmd.d) : '<span style="color:var(--muted)">No description</span>';
    const usage = esc(cmd.u || (prefix + cmd.n));

    return (
      '<article class="cmd">'+
        '<div class="cmd-head">'+
          '<span class="cmd-name"><span class="pfx">'+esc(prefix)+'</span>'+esc(cmd.n)+'</span>'+
          '<span class="cmd-desc">'+(cmd.d?esc(cmd.d):"")+'</span>'+
          '<span class="chev">'+CHEVRON_SMALL+'</span>'+
        '</div>'+
        '<div class="cmd-body">'+
          '<div class="row"><span class="label">Usage</span><span class="value"><span class="mono">'+usage+'</span></span></div>'+
          '<div class="row"><span class="label">Aliases</span><span class="value">'+aliases+'</span></div>'+
          '<div class="row"><span class="label">Desc</span><span class="value">'+desc+'</span></div>'+
        '</div>'+
      '</article>'
    );
  }

  function renderCategoryList(){
    let html = '<div class="cat-list">';
    for(let i=0;i<catKeys.length;i++){
      const k = catKeys[i];
      const n = cats[k].length;
      html +=
        '<div class="cat-item" data-cat="'+esc(k)+'">'+
          '<div class="cat-icon">'+iconFor(k)+'</div>'+
          '<div class="cat-name">'+esc(k)+'</div>'+
          '<span class="cat-count">'+n+'</span>'+
          '<span class="cat-chev">'+CHEVRON+'</span>'+
        '</div>';
    }
    html += '</div>';
    elView.innerHTML = html;
    elStatS.textContent = total;
  }

  function renderCategory(cat){
    const list = (cats[cat]||[]).filter(matches);
    const head =
      '<div class="cat-sticky">'+
        '<div class="back-bar">'+
          '<button class="back-btn" id="backBtn">'+BACK_ARROW+' Back</button>'+
          '<span class="cat-title">'+esc(cat)+'</span>'+
          '<span class="cat-total">'+list.length+'</span>'+
        '</div>'+
      '</div>';

    if(!list.length){
      elView.innerHTML = head +
        '<div class="empty"><div class="big">'+SEARCH_BIG+'</div><div>No commands match <b>'+esc(query)+'</b></div></div>';
      elStatS.textContent = 0;
      return;
    }
    elView.innerHTML = head + list.map(buildCard).join("");
    elStatS.textContent = list.length;
  }

  function render(){
    if(query){
      let html = "";
      let shown = 0;
      for(let i=0;i<catKeys.length;i++){
        const k = catKeys[i];
        const list = (cats[k]||[]).filter(matches);
        if(!list.length) continue;
        shown += list.length;
        html +=
          '<section style="margin-bottom:14px">'+
            '<h2 style="display:flex;align-items:center;gap:8px;margin:0 0 8px 2px;'+
            'font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;'+
            'color:var(--accent)">'+esc(k)+
            '<span style="margin-left:auto;color:var(--muted);font-size:11px;font-weight:600;'+
            'letter-spacing:0">'+list.length+'</span></h2>'+
            list.map(buildCard).join("")+
          '</section>';
      }
      if(!shown){
        html = '<div class="empty"><div class="big">'+SEARCH_BIG+'</div><div>No commands match <b>'+
               esc(query)+'</b></div></div>';
      }
      elStatS.textContent = shown;
      elView.innerHTML = html;
      return;
    }

    if(activeCat) renderCategory(activeCat);
    else renderCategoryList();
  }

  elView.addEventListener("click", function(e){
    if(e.target.closest("#backBtn")){
      activeCat = null;
      render();
      window.scrollTo({top:0,behavior:"smooth"});
      return;
    }
    const catItem = e.target.closest(".cat-item");
    if(catItem){
      activeCat = catItem.getAttribute("data-cat");
      query = "";
      elSearch.value = "";
      render();
      window.scrollTo({top:0,behavior:"smooth"});
      return;
    }
    const head = e.target.closest(".cmd-head");
    if(head){
      const card = head.parentElement;
      const wasOpen = card.classList.contains("open");
      const open = elView.querySelectorAll(".cmd.open");
      for(let i=0;i<open.length;i++) open[i].classList.remove("open");
      if(!wasOpen){
        card.classList.add("open");
        setTimeout(function(){ card.scrollIntoView({behavior:"smooth",block:"nearest"}); },60);
      }
    }
  });

  let searchTimer=null;
  elSearch.addEventListener("input", function(){
    clearTimeout(searchTimer);
    const val = elSearch.value;
    searchTimer = setTimeout(function(){
      query = val.trim();
      render();
    }, 120);
  });

  window.addEventListener("scroll", function(){
    if(window.scrollY>400) elTop.classList.add("show");
    else elTop.classList.remove("show");
  },{passive:true});

  elTop.addEventListener("click", function(){
    window.scrollTo({top:0,behavior:"smooth"});
  });

  render();
})();
</script>
</body>
</html>
