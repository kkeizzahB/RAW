<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>SNAKE</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #0b0e1a, #1a1f32);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 10px;
    }
    .game {
      max-width: 400px;
      width: 100%;
      background: rgba(20, 25, 45, 0.85);
      border-radius: 28px;
      padding: 16px 14px 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    h1 {
      text-align: center;
      margin: 0 0 2px;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #6fdf9f, #4ad9d9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      text-align: center;
      color: #8892b5;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .score-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .score-box {
      background: rgba(10, 14, 30, 0.6);
      border: 1px solid #2f3a5a;
      border-radius: 12px;
      padding: 4px 0;
      text-align: center;
    }
    .score-box small {
      display: block;
      font-size: 9px;
      color: #6a7699;
      text-transform: uppercase;
    }
    .score-box strong {
      font-size: 20px;
      color: #f0f4ff;
    }
    .score-box:nth-child(1) strong { color: #6fdf9f; }
    .score-box:nth-child(2) strong { color: #f7d44a; }
    .score-box:nth-child(3) strong { color: #ff7b9c; }
    #status {
      text-align: center;
      height: 22px;
      font-weight: 600;
      font-size: 13px;
      color: #b7c0e6;
      margin-bottom: 6px;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 300px;
      aspect-ratio: 1/1;
      margin: 0 auto;
      background: #0d1122;
      border-radius: 16px;
      border: 2px solid #2f3a5a;
      touch-action: none;
    }
    .controls {
      display: grid;
      grid-template-columns: 60px 60px 60px;
      gap: 8px;
      justify-content: center;
      margin: 12px auto 8px;
      max-width: 200px;
    }
    .ctrl-btn {
      background: #1f2640;
      border: 2px solid #3e4663;
      border-radius: 40px;
      width: 60px;
      height: 60px;
      font-size: 24px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #0b0e1a;
      transition: 0.05s linear;
      touch-action: manipulation;
    }
    .ctrl-btn:active {
      transform: scale(0.85);
      box-shadow: 0 1px 0 #0b0e1a;
    }
    .ctrl-btn.up { background: #1f2a4a; border-color: #4a5a8a; grid-column: 2; }
    .ctrl-btn.left { background: #1f3a2a; border-color: #4a8a5a; grid-column: 1; grid-row: 2; }
    .ctrl-btn.right { background: #3a2a4a; border-color: #7a5a9a; grid-column: 3; grid-row: 2; }
    .ctrl-btn.down { background: #4a2a2a; border-color: #9a5a5a; grid-column: 2; grid-row: 3; }
    .menu-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .menu-btn {
      flex: 1;
      background: rgba(30, 37, 60, 0.8);
      border: 1px solid #3e4663;
      border-radius: 20px;
      padding: 10px;
      font-weight: 600;
      color: #b7c0e6;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }
    .menu-btn:hover { background: #2a345a; border-color: #7a8cff; color: white; }
    @media (max-width: 380px) {
      .ctrl-btn { width: 50px; height: 50px; font-size: 20px; }
      .controls { grid-template-columns: 50px 50px 50px; gap: 6px; }
    }
  </style>
</head>
<body>
<div class="game">
  <h1>🐍 SNAKE</h1>
  <div class="sub">eat · grow · survive</div>
  <div class="score-row">
    <div class="score-box"><small>score</small><strong id="scoreDisplay">0</strong></div>
    <div class="score-box"><small>high</small><strong id="highDisplay">0</strong></div>
    <div class="score-box"><small>length</small><strong id="lengthDisplay">3</strong></div>
  </div>
  <div id="status">▶ PLAY</div>
  <canvas id="c" width="300" height="300"></canvas>
  <div class="controls">
    <button class="ctrl-btn up" id="upBtn">▲</button>
    <button class="ctrl-btn left" id="leftBtn">◀</button>
    <button class="ctrl-btn right" id="rightBtn">▶</button>
    <button class="ctrl-btn down" id="downBtn">▼</button>
  </div>
  <div class="menu-row">
    <button class="menu-btn" id="restartBtn">↺ RESTART</button>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const scoreEl = document.getElementById('scoreDisplay');
const highEl = document.getElementById('highDisplay');
const lengthEl = document.getElementById('lengthDisplay');

const GRID_SIZE = 20;
const CELL_SIZE = canvas.width / GRID_SIZE;

let snake = [];
let food = {};
let direction = 'right';
let nextDirection = 'right';
let score = 0;
let highScore = parseInt(localStorage.getItem('snakeHigh')) || 0;
let gameOver = false;
let gameLoop = null;
let speed = 150;

// Initialize
function init() {
  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];
  direction = 'right';
  nextDirection = 'right';
  score = 0;
  gameOver = false;
  statusEl.textContent = '▶ PLAY';
  highEl.textContent = highScore;
  spawnFood();
  updateUI();
}

function spawnFood() {
  let pos;
  let attempts = 0;
  do {
    pos = {
      x: Math.floor(Math.random() * GRID_SIZE),
      y: Math.floor(Math.random() * GRID_SIZE)
    };
    attempts++;
  } while ((snake.some(s => s.x === pos.x && s.y === pos.y) || 
           (food.x === pos.x && food.y === pos.y)) && attempts < 100);
  food = pos;
}

function updateUI() {
  scoreEl.textContent = score;
  lengthEl.textContent = snake.length;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHigh', highScore);
    highEl.textContent = highScore;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Draw grid
  ctx.strokeStyle = '#1a1f33';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID_SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL_SIZE, 0);
    ctx.lineTo(i * CELL_SIZE, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL_SIZE);
    ctx.lineTo(canvas.width, i * CELL_SIZE);
    ctx.stroke();
  }
  
  // Draw food
  ctx.shadowColor = '#ff7b9c';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#ff7b9c';
  ctx.beginPath();
  ctx.arc(food.x * CELL_SIZE + CELL_SIZE/2, food.y * CELL_SIZE + CELL_SIZE/2, CELL_SIZE/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Draw snake
  snake.forEach((seg, i) => {
    const gradient = ctx.createRadialGradient(
      seg.x * CELL_SIZE + 4, seg.y * CELL_SIZE + 4, 2,
      seg.x * CELL_SIZE + CELL_SIZE/2, seg.y * CELL_SIZE + CELL_SIZE/2, CELL_SIZE/2
    );
    if (i === 0) {
      gradient.addColorStop(0, '#6fdf9f');
      gradient.addColorStop(1, '#4ad9d9');
    } else {
      gradient.addColorStop(0, '#4ad9d9');
      gradient.addColorStop(1, '#2a9a8a');
    }
    ctx.fillStyle = gradient;
    ctx.shadowColor = i === 0 ? '#6fdf9f' : '#4ad9d9';
    ctx.shadowBlur = i === 0 ? 12 : 6;
    ctx.fillRect(seg.x * CELL_SIZE + 1, seg.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
    ctx.shadowBlur = 0;
  });
}

function move() {
  if (gameOver) return;
  
  direction = nextDirection;
  const head = {...snake[0]};
  
  switch(direction) {
    case 'right': head.x++; break;
    case 'left': head.x--; break;
    case 'up': head.y--; break;
    case 'down': head.y++; break;
  }
  
  // Check wall collision
  if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
    endGame();
    return;
  }
  
  // Check self collision
  if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
    endGame();
    return;
  }
  
  snake.unshift(head);
  
  // Check food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    spawnFood();
    updateUI();
    // Speed up slightly
    if (speed > 80) speed -= 2;
  } else {
    snake.pop();
  }
  
  updateUI();
}

function endGame() {
  gameOver = true;
  statusEl.textContent = '💔 GAME OVER';
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHigh', highScore);
    highEl.textContent = highScore;
  }
}

function changeDirection(newDir) {
  const opposites = {
    'up': 'down',
    'down': 'up',
    'left': 'right',
    'right': 'left'
  };
  if (newDir !== opposites[direction]) {
    nextDirection = newDir;
  }
}

function resetGame() {
  if (gameLoop) clearInterval(gameLoop);
  init();
  draw();
  gameLoop = setInterval(() => {
    move();
    draw();
  }, speed);
}

// --- EVENT BINDINGS ---
function setupControls() {
  const btns = {
    'upBtn': 'up',
    'downBtn': 'down',
    'leftBtn': 'left',
    'rightBtn': 'right'
  };
  
  Object.keys(btns).forEach(id => {
    const dir = btns[id];
    const el = document.getElementById(id);
    el.addEventListener('click', (e) => {
      e.preventDefault();
      if (!gameOver) changeDirection(dir);
    });
    el.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!gameOver) changeDirection(dir);
    });
  });
}

// Keyboard controls
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const keyMap = {
    'ArrowUp': 'up',
    'ArrowDown': 'down',
    'ArrowLeft': 'left',
    'ArrowRight': 'right'
  };
  if (keyMap[e.key]) {
    e.preventDefault();
    if (!gameOver) changeDirection(keyMap[e.key]);
  }
  if (e.key === 'r' || e.key === 'R') resetGame();
  if (e.key === ' ' && gameOver) resetGame();
});

// Restart button
document.getElementById('restartBtn').addEventListener('click', resetGame);
document.getElementById('restartBtn').addEventListener('touchstart', (e) => {
  e.preventDefault();
  resetGame();
});

// Start game
init();
draw();
gameLoop = setInterval(() => {
  move();
  draw();
}, speed);
setupControls();
</script>
</body>
</html>
