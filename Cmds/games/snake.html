<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>❄️ ICE SNAKE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: linear-gradient(145deg, #06131f 0%, #0b2638 100%);
    color: white;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    overflow-x: hidden;
}

.game {
    width: 100%;
    max-width: 400px;
    text-align: center;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(4px);
    border-radius: 24px;
    padding: 16px 14px 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid rgba(100, 220, 255, 0.08);
}

h1 {
    font-size: 28px;
    margin-bottom: 2px;
    color: #9eeaff;
    text-shadow: 0 0 20px rgba(0, 207, 255, 0.3);
    letter-spacing: 1px;
}

.subtitle {
    font-size: 10px;
    color: #5a8a9e;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.stats {
    display: flex;
    justify-content: space-between;
    background: rgba(255,255,255,0.06);
    padding: 6px 14px;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid rgba(100, 220, 255, 0.08);
}

.stats span {
    color: #8ab4c7;
    font-size: 12px;
}

.stats b {
    color: #9eeaff;
    font-size: 16px;
    font-weight: 700;
}

canvas {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #061923;
    border: 2px solid rgba(100, 220, 255, 0.15);
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0, 210, 255, 0.08);
    display: block;
    image-rendering: pixelated;
    touch-action: none;
}

button {
    border: none;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    transition: 0.15s ease;
}

#startBtn {
    margin-top: 10px;
    padding: 10px 20px;
    border-radius: 10px;
    background: linear-gradient(135deg, #4ddcff, #2bb8e0);
    color: #00131c;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 16px rgba(77, 220, 255, 0.2);
    width: 100%;
}

#startBtn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(77, 220, 255, 0.3);
}

#startBtn:active {
    transform: scale(0.96);
}

.controls {
    width: 100%;
    max-width: 180px;
    margin: 12px auto 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    justify-content: center;
}

.control {
    height: 48px;
    border-radius: 10px;
    background: rgba(18, 57, 77, 0.7);
    color: #a9eeff;
    font-size: 20px;
    border: 1px solid rgba(100, 220, 255, 0.1);
    box-shadow: 0 0 8px rgba(0, 210, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
}

.control:active {
    transform: scale(0.90);
    background: rgba(30, 102, 133, 0.8);
    border-color: #4ddcff;
}

.empty {
    visibility: hidden;
    pointer-events: none;
}

.message {
    margin-top: 8px;
    color: #4a7a8e;
    font-size: 10px;
    letter-spacing: 0.5px;
}

@media (max-width: 420px) {
    .game {
        max-width: 340px;
        padding: 12px 10px 14px;
    }
    h1 {
        font-size: 24px;
    }
    .stats span {
        font-size: 11px;
    }
    .stats b {
        font-size: 14px;
    }
    .controls {
        max-width: 150px;
        gap: 4px;
    }
    .control {
        height: 42px;
        font-size: 18px;
        border-radius: 8px;
    }
    #startBtn {
        font-size: 13px;
        padding: 8px 16px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>❄️ ICE SNAKE</h1>
    <div class="subtitle">Eat · Grow · Survive</div>

    <div class="stats">
        <span>Score: <b id="score">0</b></span>
        <span>Best: <b id="best">0</b></span>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <button id="startBtn">▶ START GAME</button>

    <div class="controls">
        <button class="control empty"></button>
        <button class="control" data-dir="up">▲</button>
        <button class="control empty"></button>

        <button class="control" data-dir="left">◀</button>
        <button class="control" data-dir="down">▼</button>
        <button class="control" data-dir="right">▶</button>
    </div>

    <div class="message">
        ⌨️ Arrow Keys / WASD &nbsp;·&nbsp; 📱 Touch Buttons
    </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const startBtn = document.getElementById("startBtn");

const grid = 20;
const tile = canvas.width / grid;

/* =========================
   GAME VARIABLES
========================= */

let snake;
let food;

let direction;
let nextDirection;

let score = 0;
let best = parseInt(localStorage.getItem("iceSnakeBest")) || 0;

let gameRunning = false;
let gameOver = false;

let timer;
let animFrame = null;

const START_SPEED = 210;
const HARD_SPEED = 55;
let speed = START_SPEED;

bestText.textContent = best;

/* =========================
   AUDIO
========================= */

let audioContext;

function playZapSound() {
    try {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sawtooth";
        oscillator.frequency.setValueAtTime(180, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(900, audioContext.currentTime + 0.08);
        oscillator.frequency.exponentialRampToValueAtTime(250, audioContext.currentTime + 0.16);

        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, audioContext.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.18);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.2);
    } catch (error) {
        // Silently fail
    }
}

/* =========================
   GAME FUNCTIONS
========================= */

function startGame() {
    if (timer) clearInterval(timer);
    if (animFrame) cancelAnimationFrame(animFrame);

    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = "right";
    nextDirection = "right";
    score = 0;
    speed = START_SPEED;
    gameRunning = true;
    gameOver = false;

    scoreText.textContent = score;
    startBtn.textContent = "🔄 RESTART";

    createFood();
    draw();

    if (timer) clearInterval(timer);
    timer = setInterval(gameLoop, speed);
}

function gameLoop() {
    if (!gameRunning) return;

    direction = nextDirection;

    const head = {
        x: snake[0].x,
        y: snake[0].y
    };

    switch (direction) {
        case "up": head.y--; break;
        case "down": head.y++; break;
        case "left": head.x--; break;
        case "right": head.x++; break;
    }

    // Wall collision
    if (head.x < 0 || head.x >= grid || head.y < 0 || head.y >= grid) {
        endGame();
        return;
    }

    // Self collision
    for (let part of snake) {
        if (head.x === part.x && head.y === part.y) {
            endGame();
            return;
        }
    }

    snake.unshift(head);

    // Eat food
    if (head.x === food.x && head.y === food.y) {
        score++;
        scoreText.textContent = score;
        playZapSound();

        if (score > best) {
            best = score;
            bestText.textContent = best;
            localStorage.setItem("iceSnakeBest", best);
        }

        // Increase difficulty
        const difficultyIncrease = 4;
        speed = Math.max(HARD_SPEED, START_SPEED - (score * difficultyIncrease));

        clearInterval(timer);
        timer = setInterval(gameLoop, speed);

        createFood();
    } else {
        snake.pop();
    }

    draw();
}

function createFood() {
    let valid = false;
    let attempts = 0;
    while (!valid && attempts < 1000) {
        food = {
            x: Math.floor(Math.random() * grid),
            y: Math.floor(Math.random() * grid)
        };
        valid = !snake.some(part => part.x === food.x && part.y === food.y);
        attempts++;
    }
    if (!valid) {
        // Board is full - win condition
        gameRunning = false;
        gameOver = true;
        clearInterval(timer);
        startBtn.textContent = "🏆 YOU WIN!";
        draw();
    }
}

function endGame() {
    gameRunning = false;
    gameOver = true;
    clearInterval(timer);
    startBtn.textContent = "↻ PLAY AGAIN";
    draw();
}

/* =========================
   DRAWING
========================= */

function draw() {
    if (animFrame) cancelAnimationFrame(animFrame);
    animFrame = requestAnimationFrame(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background
        ctx.fillStyle = "#061923";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid
        ctx.strokeStyle = "rgba(100,220,255,0.06)";
        ctx.lineWidth = 1;
        for (let i = 0; i <= grid; i++) {
            ctx.beginPath();
            ctx.moveTo(i * tile, 0);
            ctx.lineTo(i * tile, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * tile);
            ctx.lineTo(canvas.width, i * tile);
            ctx.stroke();
        }

        drawFood();

        // Snake body
        for (let i = snake.length - 1; i >= 1; i--) {
            const part = snake[i];
            const gradient = ctx.createLinearGradient(
                part.x * tile, part.y * tile,
                (part.x + 1) * tile, (part.y + 1) * tile
            );
            gradient.addColorStop(0, "#69e8ff");
            gradient.addColorStop(1, "#087fa3");
            ctx.fillStyle = gradient;
            roundRect(part.x * tile + 2, part.y * tile + 2, tile - 4, tile - 4, 5);
        }

        // Head
        if (snake.length > 0) {
            drawIceHead(snake[0].x * tile, snake[0].y * tile);
        }

        // Game over overlay
        if (gameOver) {
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#a9efff";
            ctx.font = "bold 34px Arial";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 18);
            ctx.font = "18px Arial";
            ctx.fillStyle = "#7ab8d0";
            ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 28);
            ctx.textBaseline = "alphabetic";
        }
    });
}

function drawIceHead(x, y) {
    const cx = x + tile / 2;
    const cy = y + tile / 2;

    ctx.shadowColor = "#6eeaff";
    ctx.shadowBlur = 18;

    const gradient = ctx.createRadialGradient(cx - 3, cy - 4, 2, cx, cy, tile / 2);
    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(0.35, "#b8f5ff");
    gradient.addColorStop(1, "#31acd0");
    ctx.fillStyle = gradient;
    roundRect(x + 1, y + 1, tile - 2, tile - 2, 7);

    ctx.shadowBlur = 0;

    // Ice spikes
    ctx.fillStyle = "#d9fbff";
    ctx.beginPath();
    ctx.moveTo(cx - 6, y + 3);
    ctx.lineTo(cx - 2, y - 5);
    ctx.lineTo(cx + 1, y + 3);
    ctx.moveTo(cx + 3, y + 3);
    ctx.lineTo(cx + 7, y - 5);
    ctx.lineTo(cx + 10, y + 3);
    ctx.fill();

    // Eyes
    ctx.fillStyle = "#06202d";
    let eye1, eye2;
    switch (direction) {
        case "right": eye1 = [cx + 4, cy - 4]; eye2 = [cx + 4, cy + 4]; break;
        case "left":  eye1 = [cx - 4, cy - 4]; eye2 = [cx - 4, cy + 4]; break;
        case "up":    eye1 = [cx - 4, cy - 4]; eye2 = [cx + 4, cy - 4]; break;
        default:      eye1 = [cx - 4, cy + 4]; eye2 = [cx + 4, cy + 4]; break;
    }
    ctx.beginPath();
    ctx.arc(eye1[0], eye1[1], 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(eye2[0], eye2[1], 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Eye shine
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath();
    ctx.arc(eye1[0] - 1, eye1[1] - 1.5, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(eye2[0] - 1, eye2[1] - 1.5, 1, 0, Math.PI * 2);
    ctx.fill();
}

function drawFood() {
    const cx = food.x * tile + tile / 2;
    const cy = food.y * tile + tile / 2;

    // Glow
    ctx.shadowColor = "#00eaff";
    ctx.shadowBlur = 22;

    // Outer ring
    ctx.fillStyle = "rgba(0, 234, 255, 0.15)";
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(cx, cy, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Cross lines
    ctx.strokeStyle = "#58e6ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 11);
    ctx.lineTo(cx, cy + 11);
    ctx.moveTo(cx - 11, cy);
    ctx.lineTo(cx + 11, cy);
    ctx.moveTo(cx - 7, cy - 7);
    ctx.lineTo(cx + 7, cy + 7);
    ctx.moveTo(cx + 7, cy - 7);
    ctx.lineTo(cx - 7, cy + 7);
    ctx.stroke();

    // Inner shine
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.beginPath();
    ctx.arc(cx - 2, cy - 3, 3, 0, Math.PI * 2);
    ctx.fill();
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
}

/* =========================
   CONTROLS
========================= */

function changeDirection(newDirection) {
    if (!gameRunning || gameOver) return;

    const opposites = {
        up: "down",
        down: "up",
        left: "right",
        right: "left"
    };

    if (newDirection !== opposites[direction]) {
        nextDirection = newDirection;
    }
}

// Keyboard
document.addEventListener("keydown", function(e) {
    const keyMap = {
        "ArrowUp": "up", "ArrowDown": "down",
        "ArrowLeft": "left", "ArrowRight": "right",
        "w": "up", "W": "up",
        "s": "down", "S": "down",
        "a": "left", "A": "left",
        "d": "right", "D": "right"
    };
    const dir = keyMap[e.key];
    if (dir) {
        e.preventDefault();
        changeDirection(dir);
    }
    if (e.key === " " || e.key === "Space") {
        e.preventDefault();
        if (!gameRunning && !gameOver) startGame();
    }
});

// Touch controls
document.querySelectorAll(".control[data-dir]").forEach(button => {
    button.addEventListener("pointerdown", function(e) {
        e.preventDefault();
        const dir = this.dataset.dir;
        if (dir) changeDirection(dir);
    });
});

// Start button
startBtn.addEventListener("click", startGame);

/* =========================
   INIT
========================= */

// Initial state
snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
];
direction = "right";
nextDirection = "right";
createFood();
draw();

// Prevent context menu on canvas
canvas.addEventListener("contextmenu", e => e.preventDefault());

</script>

</body>
</html>
