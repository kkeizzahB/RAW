<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Moto Rider · Real Hill Racing</title>
<style>
  * { -webkit-tap-highlight-color: transparent; -webkit-user-select:none; user-select:none;
      -webkit-touch-callout:none; box-sizing:border-box; margin:0; padding:0; }
  html,body{height:100%;}
  body{
    background:#0a0e1a; font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    color:#fff; touch-action:none; overflow:hidden; display:flex; justify-content:center;
    align-items:center; min-height:100vh;
  }
  .wrap{ width:100%; max-width:480px; margin:auto; padding:10px; }
  .card{
    background:linear-gradient(160deg,#111827,#0b0f1a); border:1px solid rgba(255,255,255,0.08);
    border-radius:26px; overflow:hidden; box-shadow:0 30px 70px rgba(0,0,0,0.75); position:relative;
  }
  .hdr{
    padding:14px 18px; display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(180deg,rgba(20,26,42,0.95),rgba(10,14,24,0.6));
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .logo{ display:flex; align-items:center; gap:8px; font-weight:900; font-size:19px; letter-spacing:-0.4px;
         background:linear-gradient(90deg,#ff5f6d,#ffc371); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .logo svg{ filter:drop-shadow(0 0 6px rgba(255,120,80,.6)); }
  .tag{ font-size:9px; letter-spacing:2.5px; color:#5b6478; font-weight:800; }
  .stats{ display:flex; gap:14px; align-items:center; }
  .stat{ text-align:right; }
  .dist{ font-family:'Courier New',monospace; font-size:19px; font-weight:900; color:#4ade80; text-shadow:0 0 14px rgba(74,222,128,.5);}
  .best{ font-size:10px; color:#8b93a7; font-weight:700; margin-top:1px;}
  .coin{ font-size:12px; font-weight:800; color:#fbbf24; display:flex; gap:4px; align-items:center; justify-content:flex-end;}

  .stage{ position:relative; padding:10px; background:#000; }
  canvas#g{ width:100%; height:auto; display:block; border-radius:16px; background:#87ceeb; }

  .hud-fuel{
    position:absolute; top:22px; right:22px; width:80px; height:16px; border-radius:8px;
    background:rgba(10,14,24,0.7); border:1px solid rgba(255,255,255,0.2); overflow:hidden; z-index:5;
  }
  .hud-fuel-fill{ height:100%; width:100%; background:linear-gradient(90deg,#22c55e,#4ade80); transition:width .15s; }
  .hud-fuel-lbl{ position:absolute; top:23px; right:106px; font-size:11px; z-index:5; font-weight:800; color:#e2e8f0; text-shadow:0 1px 3px #000;}

  .speedo{ position:absolute; bottom:16px; left:16px; z-index:5; background:rgba(10,14,24,0.55);
    border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:4px 10px; font-family:monospace;
    font-weight:900; font-size:13px; color:#fbbf24; }

  .ctrls{ display:flex; gap:12px; padding:10px 14px 16px; background:rgba(8,11,20,0.95); }
  .btn{
    flex:1; padding:15px 0; border-radius:16px; font-weight:900; font-size:15px; letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    border:1px solid rgba(255,255,255,0.18); transition:transform .08s;
  }
  .btn.active{ transform:translateY(3px) scale(.96); }
  .btn.brake{ background:linear-gradient(180deg,#ef4444cc,#991b1bcc); box-shadow:0 6px 18px rgba(239,68,68,.35);}
  .btn.gas{ background:linear-gradient(180deg,#22c55ecc,#15803dcc); box-shadow:0 6px 18px rgba(34,197,94,.35);}

  .overlay{
    position:absolute; inset:0; background:rgba(8,11,20,0.95); backdrop-filter:blur(10px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    z-index:20; padding:26px; text-align:center; border-radius:16px;
  }
  .overlay.hidden{ display:none !important; }
  .big-title{ font-size:26px; font-weight:900; display:flex; align-items:center; gap:10px;
    background:linear-gradient(90deg,#ff5f6d,#ffc371); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:none; }
  .sub{ font-size:13px; color:#a7b0c2; max-width:280px; line-height:1.5; font-weight:600; }
  .go-title{ font-size:26px; font-weight:900; color:#f87171; display:flex; gap:8px; align-items:center;}
  .action{
    background:linear-gradient(180deg,#ffd166,#fb923c); color:#1a1206; border:none; font-weight:900;
    padding:13px 38px; border-radius:30px; font-size:15px; letter-spacing:1px; text-transform:uppercase;
    display:flex; align-items:center; gap:8px; cursor:pointer; box-shadow:0 10px 26px rgba(251,146,60,.45);
  }
  .action:active{ transform:scale(.95); }
  .mini-stats{ display:flex; gap:10px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    border-radius:14px; padding:10px 20px; }
  .mini{ text-align:center; }
  .mini-lbl{ font-size:9px; color:#8b93a7; font-weight:800; text-transform:uppercase; }
  .mini-val{ font-size:16px; font-weight:900; color:#f1f5f9; }
  .snd{ position:absolute; top:18px; left:18px; width:34px; height:34px; border-radius:50%;
    background:rgba(10,14,24,.65); border:1px solid rgba(255,255,255,.18); display:flex; align-items:center;
    justify-content:center; font-size:14px; cursor:pointer; z-index:20;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hdr">
      <div>
        <div class="tag">HILL · MOTO RACING</div>
        <div class="logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17a3 3 0 1 0 0.001-.001M19 17a3 3 0 1 0 0.001-.001M5 17l3-6h6l3 6M8 11l2-4h3l1 4"/></svg>
          MOTO RIDER
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="coin" id="coins">🪙 0</div></div>
        <div class="stat"><div class="dist" id="dist">0000m</div><div class="best" id="best">BEST 0000m</div></div>
      </div>
    </div>

    <div class="stage">
      <canvas id="g" width="400" height="230"></canvas>
      <div class="hud-fuel-lbl">⛽</div>
      <div class="hud-fuel"><div class="hud-fuel-fill" id="fuelFill"></div></div>
      <div class="speedo" id="speedo">0 km/h</div>
      <div class="snd" id="sndBtn">🔊</div>

      <div class="overlay" id="startOv">
        <div class="big-title">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffc371" stroke-width="2"><path d="M5 17a3 3 0 1 0 0.001-.001M19 17a3 3 0 1 0 0.001-.001M5 17l3-6h6l3 6M8 11l2-4h3l1 4"/></svg>
          MOTO RIDER
        </div>
        <div class="sub">Race across the hills. Balance your bike in the air, don't flip, and don't run dry.</div>
        <div class="mini-stats">
          <div class="mini"><div class="mini-lbl">Best</div><div class="mini-val" id="startBest" style="color:#fbbf24;">0m</div></div>
          <div class="mini"><div class="mini-lbl">Controls</div><div class="mini-val" style="font-size:13px;">Gas / Brake</div></div>
        </div>
        <button class="action" id="btnStart">▶ Start Ride</button>
      </div>

      <div class="overlay hidden" id="goOv">
        <div class="go-title" id="goTitle">💥 Wipeout!</div>
        <div class="mini-stats">
          <div class="mini"><div class="mini-lbl">Distance</div><div class="mini-val" id="finalDist" style="color:#60a5fa;">0m</div></div>
          <div class="mini"><div class="mini-lbl">Coins</div><div class="mini-val" id="finalCoins" style="color:#fbbf24;">0</div></div>
          <div class="mini"><div class="mini-lbl">Best</div><div class="mini-val" id="finalBest" style="color:#fbbf24;">0m</div></div>
        </div>
        <button class="action" id="btnRetry">↻ Retry</button>
      </div>
    </div>

    <div class="ctrls">
      <div class="btn brake" id="btnBrake">◀ BRAKE</div>
      <div class="btn gas" id="btnGas">GAS ▶</div>
    </div>
  </div>
</div>

<script>
(function(){
  const cv = document.getElementById('g');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  const distEl = document.getElementById('dist');
  const bestEl = document.getElementById('best');
  const coinsEl = document.getElementById('coins');
  const startBestEl = document.getElementById('startBest');
  const finalDistEl = document.getElementById('finalDist');
  const finalCoinsEl = document.getElementById('finalCoins');
  const finalBestEl = document.getElementById('finalBest');
  const goTitle = document.getElementById('goTitle');
  const startOv = document.getElementById('startOv');
  const goOv = document.getElementById('goOv');
  const fuelFill = document.getElementById('fuelFill');
  const speedoEl = document.getElementById('speedo');
  const sndBtn = document.getElementById('sndBtn');
  const btnStart = document.getElementById('btnStart');
  const btnRetry = document.getElementById('btnRetry');
  const btnGas = document.getElementById('btnGas');
  const btnBrake = document.getElementById('btnBrake');

  // ---------- AUDIO ----------
  let actx=null, muted=false, engineOsc=null, engineOsc2=null, engineGain=null;
  function initAudio(){
    if(!actx){ const AC = window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); }
    if(actx && actx.state==='suspended') actx.resume();
  }
  function startEngine(){
    if(muted || !actx || engineOsc) return;
    try{
      engineOsc = actx.createOscillator();
      engineOsc2 = actx.createOscillator();
      engineGain = actx.createGain();
      engineOsc.type='sawtooth'; engineOsc2.type='square';
      engineOsc.frequency.setValueAtTime(70, actx.currentTime);
      engineOsc2.frequency.setValueAtTime(35, actx.currentTime);
      engineGain.gain.setValueAtTime(0.025, actx.currentTime);
      engineOsc.connect(engineGain); engineOsc2.connect(engineGain);
      engineGain.connect(actx.destination);
      engineOsc.start(); engineOsc2.start();
    }catch(e){}
  }
  function updateEngine(speedRatio, gas){
    if(muted || !engineOsc || !actx) return;
    try{
      const f = 55 + speedRatio*220 + (gas?70:0);
      engineOsc.frequency.setTargetAtTime(f, actx.currentTime, 0.06);
      engineOsc2.frequency.setTargetAtTime(f*0.5, actx.currentTime, 0.06);
      engineGain.gain.setTargetAtTime(gas?0.075:0.028, actx.currentTime, 0.08);
    }catch(e){}
  }
  function stopEngine(){
    if(engineOsc){ try{engineOsc.stop(); engineOsc2.stop();}catch(e){} engineOsc=null; engineOsc2=null; engineGain=null; }
  }
  function sfx(type){
    if(muted) return; initAudio(); if(!actx) return;
    try{
      const o=actx.createOscillator(), g=actx.createGain();
      o.connect(g); g.connect(actx.destination);
      const t=actx.currentTime;
      if(type==='coin'){
        o.type='sine'; o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(1400,t+0.1);
        g.gain.setValueAtTime(0.16,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.15);
        o.start(); o.stop(t+0.15);
      } else if(type==='fuel'){
        o.type='triangle'; o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(900,t+0.25);
        g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.25);
        o.start(); o.stop(t+0.25);
      } else if(type==='crash'){
        o.type='sawtooth'; o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(35,t+0.45);
        g.gain.setValueAtTime(0.32,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.45);
        o.start(); o.stop(t+0.45);
      } else if(type==='wheelie'){
        o.type='sine'; o.frequency.setValueAtTime(500,t); o.frequency.exponentialRampToValueAtTime(760,t+0.15);
        g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.18);
        o.start(); o.stop(t+0.18);
      }
    }catch(e){}
  }
  sndBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    muted=!muted; sndBtn.textContent = muted?'🔇':'🔊';
    if(muted) stopEngine(); else if(playing && !over) startEngine();
  });

  // ---------- STORAGE ----------
  function loadBest(){
    let vals=[];
    try{ let v=localStorage.getItem('moto_best'); if(v) vals.push(parseInt(v,10)); }catch(e){}
    try{ let v=sessionStorage.getItem('moto_best'); if(v) vals.push(parseInt(v,10)); }catch(e){}
    return vals.length? Math.max(...vals.filter(v=>!isNaN(v))) : 0;
  }
  function saveBest(v){
    const s=String(Math.floor(v));
    try{ localStorage.setItem('moto_best', s); }catch(e){}
    try{ sessionStorage.setItem('moto_best', s); }catch(e){}
  }
  let best = loadBest();
  bestEl.textContent = 'BEST '+best+'m';
  startBestEl.textContent = best+'m';

  // ---------- TERRAIN ----------
  function terrainH(x){
    if(x<80) return 150;
    let h = 150
      + Math.sin(x*0.004)*38
      + Math.sin(x*0.011)*16
      + Math.sin(x*0.027)*6;
    // occasional jump ramps
    const ri = Math.floor(x/480); const rs = ri*480 + 300;
    if(x>=rs && x<=rs+40){ const p=(x-rs)/40; h -= Math.sin(p*Math.PI)*30; }
    // small bumps
    const bi = Math.floor(x/150); const bs = bi*150 + 60;
    if(x>=bs && x<=bs+18){ const p=(x-bs)/18; h -= Math.sin(p*Math.PI)*9; }
    return h;
  }
  function terrainSlope(x){
    const d=6; return Math.atan2(terrainH(x+d)-terrainH(x-d), d*2);
  }

  // ---------- WORLD STATE ----------
  let bike, wheelF, wheelR, fuel, dist, coins;
  let suspF=0, suspR=0, suspVF=0, suspVR=0;
  let playing=false, over=false, gas=false, brake=false;
  let camX=0, camY=0, animId=null, lastT=0;
  let items=[], particles=[], texts=[];

  function spawnItems(a,b){
    for(let x=a; x<b; x+= 130+Math.random()*150){
      if(x<250) continue;
      const type = Math.random()<0.2 ? 'fuel':'coin';
      items.push({x, y: terrainH(x)-24, type, got:false});
    }
  }
  function floatText(t,x,y,c){ texts.push({t,x,y,a:1,c}); }

  function reset(){
    const h0 = terrainH(100);
    bike = {x:100, y:h0-20, vx:2.2, vy:0, ang:0, vAng:0};
    wheelF = {x:120, y:h0-8, rot:0};
    wheelR = {x:82, y:h0-8, rot:0};
    suspF=0; suspR=0; suspVF=0; suspVR=0;
    fuel=100; dist=0; coins=0;
    gas=false; brake=false; over=false;
    camX=0; camY=0;
    items=[]; particles=[]; texts=[];
    spawnItems(260, 2600);
    coinsEl.textContent='🪙 0';
  }

  function endGame(msg){
    over = true; stopEngine(); sfx('crash');
    goTitle.textContent = msg;
    finalDistEl.textContent = Math.floor(dist)+'m';
    finalCoinsEl.textContent = coins;
    finalBestEl.textContent = Math.floor(best)+'m';
    goOv.classList.remove('hidden');
  }

  function update(dt){
    if(!playing || over) return;

    fuel -= (gas? 0.05 : 0.008) * dt;
    fuel = Math.max(0, fuel);
    if(fuel<=0 && Math.abs(bike.vx)<0.15){ endGame('⛽ Out of Fuel!'); return; }

    bike.vy += 0.27*dt;
    bike.vAng *= 0.93;

    const power = 0.15;
    const cosA=Math.cos(bike.ang), sinA=Math.sin(bike.ang);

    if(gas && fuel>0){
      bike.vx += cosA*power*dt;
      bike.vy += sinA*power*dt;
      bike.vAng += 0.0048*dt;
      wheelF.rot += bike.vx*0.16; wheelR.rot += bike.vx*0.16;
    }
    if(brake){
      bike.vx -= cosA*(power*0.5)*dt;
      bike.vAng -= 0.0065*dt;
      wheelF.rot += bike.vx*0.08; wheelR.rot += bike.vx*0.08;
    }
    if(!gas) bike.vx *= (1-0.0006*dt); // rolling friction

    bike.x += bike.vx*dt;
    bike.y += bike.vy*dt;
    bike.ang += bike.vAng*dt;

    const cA=Math.cos(bike.ang), sA=Math.sin(bike.ang);
    const k=0.27, damp=0.75;
    suspVF += (-suspF)*k*dt; suspVF*=damp; suspF += suspVF*dt;
    suspVR += (-suspR)*k*dt; suspVR*=damp; suspR += suspVR*dt;

    wheelF.x = bike.x + cA*21 - sA*(9+suspF);
    wheelF.y = bike.y + sA*21 + cA*(9+suspF);
    wheelR.x = bike.x - cA*21 - sA*(9+suspR);
    wheelR.y = bike.y - sA*21 + cA*(9+suspR);

    const wr=9.5;
    const thF = terrainH(wheelF.x);
    let grounded=false;
    if(wheelF.y+wr > thF){
      const ov=(wheelF.y+wr)-thF;
      bike.y -= ov*0.6; suspF -= ov*0.4; suspVF -= ov*0.3;
      bike.vy*=0.15; bike.vx*=0.988;
      bike.vAng += (terrainSlope(wheelF.x)-bike.ang)*0.09*dt;
      grounded=true;
    }
    const thR = terrainH(wheelR.x);
    if(wheelR.y+wr > thR){
      const ov=(wheelR.y+wr)-thR;
      bike.y -= ov*0.6; suspR -= ov*0.4; suspVR -= ov*0.3;
      bike.vy*=0.15; bike.vx*=0.988;
      bike.vAng += (terrainSlope(wheelR.x)-bike.ang)*0.09*dt;
      grounded=true;
    }
    suspF = Math.max(-6,Math.min(6,suspF));
    suspR = Math.max(-6,Math.min(6,suspR));

    wheelF.x = bike.x + cA*21 - sA*(9+suspF);
    wheelF.y = bike.y + sA*21 + cA*(9+suspF);
    wheelR.x = bike.x - cA*21 - sA*(9+suspR);
    wheelR.y = bike.y - sA*21 + cA*(9+suspR);

    const normAng = Math.abs(Math.atan2(Math.sin(bike.ang), Math.cos(bike.ang)));
    const headX = bike.x + sA*15, headY = bike.y - cA*15;
    if(normAng>2.15 && headY > terrainH(headX)-2){ endGame('💥 Wipeout!'); return; }

    dist = Math.max(dist, (bike.x-100)/10);
    if(dist>best){ best=Math.floor(dist); saveBest(best); }

    distEl.textContent = String(Math.floor(dist)).padStart(4,'0')+'m';
    bestEl.textContent = 'BEST '+Math.floor(best)+'m';
    coinsEl.textContent = '🪙 '+coins;
    fuelFill.style.width = fuel+'%';
    fuelFill.style.background = fuel<25 ? 'linear-gradient(90deg,#ef4444,#f87171)' : (fuel<50 ? 'linear-gradient(90deg,#eab308,#facc15)' : 'linear-gradient(90deg,#22c55e,#4ade80)');
    speedoEl.textContent = Math.max(0,Math.round(bike.vx*22)) + ' km/h';

    items.forEach(it=>{
      if(!it.got && Math.hypot(bike.x-it.x, bike.y-it.y)<26){
        it.got=true;
        if(it.type==='coin'){ coins+=10; sfx('coin'); floatText('+10', it.x, it.y, '#fbbf24'); }
        else { fuel=Math.min(100,fuel+45); sfx('fuel'); floatText('+FUEL', it.x, it.y, '#4ade80'); }
      }
    });
    const lastX = items.length ? items[items.length-1].x : bike.x;
    if(bike.x+520 > lastX) spawnItems(lastX+130, lastX+1800);

    updateEngine(Math.min(1,Math.abs(bike.vx)/6.5), gas);
  }

  // ---------- DRAW ----------
  function skyGrad(){
    const g = ctx.createLinearGradient(0,camY,0,camY+H);
    g.addColorStop(0,'#1b2a4a'); g.addColorStop(0.35,'#3f7cd6'); g.addColorStop(0.7,'#7fc4ef'); g.addColorStop(1,'#cdeeff');
    return g;
  }
  function drawMountains(layerOffsetFactor, color, ampl, freq, baseY){
    ctx.fillStyle = color;
    ctx.beginPath();
    const startX = camX - (camX%200) - 200;
    ctx.moveTo(startX, camY+H);
    for(let x=startX; x<camX+W+200; x+=20){
      const y = baseY + Math.sin((x*layerOffsetFactor)*freq)*ampl + Math.sin(x*freq*2.3)*ampl*0.4;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(camX+W+200, camY+H);
    ctx.closePath(); ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    if(!playing) return;

    camX += (bike.x-130-camX)*0.1;
    camY += (bike.y-150-camY)*0.1;

    const cA=Math.cos(bike.ang), sA=Math.sin(bike.ang);

    if(gas && Math.random()<0.7){
      particles.push({
        x: bike.x - cA*24 + sA*4, y: bike.y - sA*24 - cA*4,
        vx: -cA*2.2+(Math.random()-0.5), vy:-sA*2.2+(Math.random()-0.5)-0.3,
        r:2.2+Math.random(), a:0.65, sm:true
      });
    }
    // dust from rear wheel when grounded and moving
    if(Math.abs(bike.vx)>1 && Math.random()<0.5){
      particles.push({x:wheelR.x, y:wheelR.y+6, vx:-bike.vx*0.3+(Math.random()-0.5), vy:-0.6-Math.random()*0.6, r:2, a:0.5, sm:false});
    }

    ctx.save();
    ctx.translate(-camX,-camY);

    ctx.fillStyle = skyGrad();
    ctx.fillRect(camX, camY, W, H);

    // sun
    ctx.fillStyle='rgba(255,244,214,0.9)';
    ctx.beginPath(); ctx.arc(camX+W-60, camY+50, 22,0,Math.PI*2); ctx.fill();

    // clouds
    ctx.fillStyle='rgba(255,255,255,0.8)';
    for(let x=camX-(camX%220); x<camX+W+220; x+=200){
      const cy = 40+Math.sin(x*0.02)*12;
      ctx.beginPath();
      ctx.arc(x,cy,12,0,Math.PI*2); ctx.arc(x+12,cy-5,15,0,Math.PI*2); ctx.arc(x+26,cy,10,0,Math.PI*2); ctx.fill();
    }

    // far mountains
    drawMountains(0.004, 'rgba(90,110,150,0.55)', 26, 1, camY+120);
    // mid hills
    drawMountains(0.007, 'rgba(60,120,90,0.55)', 20, 1, camY+150);

    // ground fill
    ctx.fillStyle='#3a2415';
    ctx.beginPath();
    ctx.moveTo(camX-20, camY+H);
    for(let x=camX-20;x<camX+W+20;x+=8) ctx.lineTo(x, terrainH(x));
    ctx.lineTo(camX+W+20, camY+H);
    ctx.fill();

    // grass top strip
    ctx.fillStyle='#3fae4e';
    ctx.beginPath();
    ctx.moveTo(camX-20, terrainH(camX-20));
    for(let x=camX-20;x<camX+W+20;x+=8) ctx.lineTo(x, terrainH(x));
    for(let x=camX+W+20;x>=camX-20;x-=8) ctx.lineTo(x, terrainH(x)+6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.15)';
    for(let x=camX-20;x<camX+W+20;x+=8) ctx.fillRect(x,terrainH(x),4,2);

    // items
    items.forEach(it=>{
      if(it.got) return;
      if(it.x<camX-20 || it.x>camX+W+20) return;
      ctx.save(); ctx.translate(it.x,it.y);
      if(it.type==='coin'){
        ctx.fillStyle='#fbbf24'; ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#b45309'; ctx.lineWidth=1.5; ctx.stroke();
        ctx.fillStyle='#b45309'; ctx.font='9px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$',0,0.5);
      } else {
        ctx.fillStyle='#ef4444'; ctx.fillRect(-6,-9,12,16);
        ctx.fillStyle='#fff'; ctx.font='bold 7px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('GAS',0,0);
      }
      ctx.restore();
    });

    // particles (smoke/dust)
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.r+=0.12; p.a-=0.028;
      if(p.a<=0){ particles.splice(i,1); continue; }
      ctx.fillStyle = p.sm ? `rgba(200,200,210,${p.a})` : `rgba(160,120,80,${p.a})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    for(let i=texts.length-1;i>=0;i--){
      const t=texts[i]; t.y-=0.8; t.a-=0.022;
      if(t.a<=0){ texts.splice(i,1); continue; }
      ctx.globalAlpha=t.a; ctx.fillStyle=t.c; ctx.font='bold 12px system-ui'; ctx.fillText(t.t,t.x,t.y);
      ctx.globalAlpha=1;
    }

    // ---- MOTORBIKE ----
    // shock/fork lines
    ctx.strokeStyle='#2a2f3a'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(bike.x-cA*16, bike.y-sA*16); ctx.lineTo(wheelR.x,wheelR.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bike.x+cA*16, bike.y+sA*16); ctx.lineTo(wheelF.x,wheelF.y); ctx.stroke();

    // wheels
    [wheelF, wheelR].forEach(w=>{
      ctx.save(); ctx.translate(w.x,w.y); ctx.rotate(w.rot);
      ctx.fillStyle='#111827'; ctx.beginPath(); ctx.arc(0,0,10.5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#1f2937'; ctx.lineWidth=2; ctx.stroke();
      // knobby tire tread
      ctx.fillStyle='#000';
      for(let a=0;a<Math.PI*2;a+=Math.PI/6){ ctx.fillRect(Math.cos(a)*9.5-1, Math.sin(a)*9.5-1, 2.4,2.4); }
      ctx.fillStyle='#cbd5e1'; ctx.beginPath(); ctx.arc(0,0,5.2,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#64748b'; ctx.lineWidth=1;
      for(let a=0;a<Math.PI*2;a+=Math.PI/2.5){ ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*5,Math.sin(a)*5); ctx.stroke(); }
      ctx.fillStyle='#fbbf24'; ctx.beginPath(); ctx.arc(0,0,1.8,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    // bike body + rider
    ctx.save(); ctx.translate(bike.x,bike.y); ctx.rotate(bike.ang);

    // exhaust pipe
    ctx.fillStyle='#94a3b8'; ctx.fillRect(-24,-2,10,4);
    // main frame/tank
    ctx.fillStyle='#e11d48';
    ctx.beginPath();
    ctx.moveTo(-18,-2); ctx.quadraticCurveTo(-6,-13,10,-9); ctx.quadraticCurveTo(18,-7,18,-1);
    ctx.lineTo(14,4); ctx.lineTo(-16,4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#881337'; ctx.lineWidth=1.2; ctx.stroke();
    // tank highlight
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(-2,-8,6,2.4,-0.2,0,Math.PI*2); ctx.fill();
    // seat
    ctx.fillStyle='#111827'; ctx.fillRect(-14,-6,16,4);
    // engine block
    ctx.fillStyle='#1f2937'; ctx.fillRect(-6,0,14,8);
    ctx.fillStyle='#475569'; ctx.fillRect(-4,2,4,4); ctx.fillRect(4,2,4,4);
    // front fairing
    ctx.fillStyle='#e11d48'; ctx.beginPath();
    ctx.moveTo(14,-8); ctx.lineTo(22,-6); ctx.lineTo(20,0); ctx.lineTo(12,-2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#881337'; ctx.stroke();
    // headlamp
    ctx.fillStyle='#fef9c3'; ctx.beginPath(); ctx.arc(20,-5,2.6,0,Math.PI*2); ctx.fill();
    // headlight beam
    ctx.fillStyle='rgba(254,249,195,0.22)';
    ctx.beginPath(); ctx.moveTo(21,-5); ctx.lineTo(46,-14); ctx.lineTo(46,4); ctx.closePath(); ctx.fill();

    // rider: legs
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-4,-4); ctx.lineTo(2,4); ctx.lineTo(-1,8); ctx.stroke();
    // rider torso lean (leans back on wheelie via angle offset visually baked into pose)
    ctx.strokeStyle='#2563eb'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(-4,-4); ctx.lineTo(-11,-18); ctx.stroke();
    // rider arm to handlebar
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.moveTo(-9,-14); ctx.lineTo(10,-11); ctx.stroke();
    // helmet
    ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(-12,-21,5.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1e293b'; ctx.beginPath(); ctx.ellipse(-9,-20,2.6,2,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#a16207'; ctx.lineWidth=1; ctx.stroke();

    ctx.restore();
    ctx.restore();
  }

  function loop(ts){
    if(!playing) return;
    if(!lastT) lastT=ts;
    const dt = Math.min((ts-lastT)/16.67, 2.0);
    lastT = ts;
    update(dt);
    draw();
    if(!over) animId = requestAnimationFrame(loop);
  }

  // ---------- INPUT ----------
  function bindHold(el, onDown, onUp){
    const down=(e)=>{ e.preventDefault(); e.stopPropagation(); el.classList.add('active'); onDown(); };
    const up=(e)=>{ e.preventDefault(); e.stopPropagation(); el.classList.remove('active'); onUp(); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('touchstart', down, {passive:false});
    el.addEventListener('touchend', up, {passive:false});
  }
  bindHold(btnGas, ()=>{gas=true;}, ()=>{gas=false;});
  bindHold(btnBrake, ()=>{brake=true;}, ()=>{brake=false;});

  document.addEventListener('keydown', e=>{
    if(['ArrowRight','d','D'].includes(e.key)){ gas=true; btnGas.classList.add('active'); }
    if(['ArrowLeft','a','A'].includes(e.key)){ brake=true; btnBrake.classList.add('active'); }
  });
  document.addEventListener('keyup', e=>{
    if(['ArrowRight','d','D'].includes(e.key)){ gas=false; btnGas.classList.remove('active'); }
    if(['ArrowLeft','a','A'].includes(e.key)){ brake=false; btnBrake.classList.remove('active'); }
  });

  btnStart.addEventListener('click', ()=>{
    initAudio(); startOv.classList.add('hidden');
    playing=true; reset(); startEngine(); lastT=0;
    animId=requestAnimationFrame(loop);
  });
  btnRetry.addEventListener('click', ()=>{
    initAudio(); goOv.classList.add('hidden');
    playing=true; reset(); startEngine(); lastT=0;
    animId=requestAnimationFrame(loop);
  });

  reset(); draw();
})();
</script>
</body>
</html>
